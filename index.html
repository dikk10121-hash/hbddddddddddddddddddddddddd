<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="icon" href="img/flowers.png" type="image/x-icon">
  <title>Happy Birthday</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-a: #ffd6e3;
      --bg-b: #ffb6cf;
      --accent-a: #ff8fa3;
      --accent-b: #ff6b81;
      --text-dark: #5a2132;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
      color:var(--text-dark);
      overflow:hidden;
    }

    .wrap {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 20px;
      position:relative;
      overflow:hidden;
    }

    .content {
      width:100%;
      max-width:980px;
      text-align:center;
      padding:36px 20px;
      border-radius:16px;
      position:relative;
      z-index: 2;
    }

    .title {
      font-family: "Great Vibes", cursive;
      font-size: clamp(40px, 7vw, 84px);
      color: #5b1630;
      margin: 0;
      line-height:1;
      transform: translateY(-28px);
    }

    .subtitle {
      font-size: clamp(14px, 2.2vw, 20px);
      color: #6f2a46;
      margin: 12px 0 22px 0;
      opacity:0.95;
    }

    .hearts-row {
      display:flex;
      gap:10px;
      justify-content:center;
      margin-bottom:28px;
      align-items:center;
    }
    .small-heart { font-size:26px; transform-origin:center; animation: beat 1.9s infinite; }
    .small-heart:nth-child(2){ animation-delay:.12s }
    .small-heart:nth-child(3){ animation-delay:.26s }
    @keyframes beat{
      0%{ transform:scale(.92); opacity:.9 }
      50%{ transform:scale(1.2); opacity:1 }
      100%{ transform:scale(.92); opacity:.9 }
    }

    .cta {
      display:inline-flex;
      align-items:center;
      gap:12px;
      padding:14px 28px;
      border-radius:36px;
      font-weight:600;
      font-size:18px;
      color:white;
      background: linear-gradient(90deg, var(--accent-a) 0%, var(--accent-b) 100%);
      border:none;
      box-shadow: 0 10px 30px rgba(255,105,150,0.18);
      cursor:pointer;
      transition: transform .18s ease, box-shadow .18s ease;
      text-decoration:none;
    }
    .cta:active{ transform:translateY(1px) }
    .cta:hover{ transform:translateY(-4px); box-shadow: 0 18px 40px rgba(255,105,150,0.22) }

    /* floating big accessories */
    .decor {
      position: absolute;
      font-size: 80px;
      opacity: 0.25;
      z-index: 1;
      animation: float 8s ease-in-out infinite;
    }
    .decor:nth-child(1){ top:10%; left:5%; animation-delay:0s;}
    .decor:nth-child(2){ bottom:12%; right:8%; animation-delay:2s;}
    .decor:nth-child(3){ top:20%; right:20%; animation-delay:4s;}
    .decor:nth-child(4){ bottom:25%; left:15%; animation-delay:6s;}
    @keyframes float {
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-20px); }
    }

    /* floating hearts (confetti) */
    .floating-heart {
      position:absolute;
      pointer-events:none;
      will-change: transform, opacity;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 6px 14px rgba(200,50,100,0.15));
      z-index: 0;
    }
    @keyframes floatUp{
      0%{ transform: translateY(40px) scale(1) rotate(0deg); opacity:0; }
      10%{ opacity:1 }
      100%{ transform: translateY(-200px) scale(1.3) rotate(18deg); opacity:0; }
    }

    .fade-out { opacity:0; transform:scale(.98); transition: opacity .9s ease, transform .9s ease; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- big accessories -->
    <div class="decor">💖</div>
    <div class="decor">💗</div>
    <div class="decor">🌸</div>
    <div class="decor">🤍</div>

    <div id="content" class="content">
      <h1 class="title">Happy Birthday, Beautiful!</h1>
      <p class="subtitle">Today is all about celebrating you and the joy you bring to my life.</p>

      <div class="hearts-row">
        <span class="small-heart">💖</span>
        <span class="small-heart">💗</span>
        <span class="small-heart">🤍</span>
      </div>

      <div style="margin-top:6px;">
        <button id="startBtn" class="cta">
          <span>I have Something For U <3</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const heartEmojis = ["💖","💗","🤍","💞","💕"];
    const wrap = document.querySelector('.wrap');

    function spawnFloatingHeart(){
      const el = document.createElement('div');
      el.className = 'floating-heart';
      el.innerHTML = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
      const left = Math.random() * 90; 
      el.style.left = left + 'vw';
      el.style.top = '100vh';
      const size = Math.random() * 40 + 30; // lebih besar
      el.style.fontSize = size + 'px';
      const dur = (Math.random() * 2 + 4).toFixed(2);
      el.style.animationDuration = dur + 's';
      wrap.appendChild(el);
      setTimeout(()=> el.remove(), (parseFloat(dur) * 1000) + 300);
    }

    const heartInterval = setInterval(spawnFloatingHeart, 400); // lebih banyak

    const startBtn = document.getElementById('startBtn');
    const content = document.getElementById('content');

    startBtn.addEventListener('click', ()=> {
      for(let i=0;i<12;i++){
        setTimeout(spawnFloatingHeart, i*50);
      }
      content.classList.add('fade-out');
      clearInterval(heartInterval);
      setTimeout(()=> {
        window.location.href = 'surprise.html';
      }, 820);
    });
  </script>
</body>
</html>
